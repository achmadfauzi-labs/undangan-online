services:
  backend:
    build:
      context: ../Backend
      dockerfile: Dockerfile
    ports:
      - "8083:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database-db-1:5432/undangan
      SPRING_DATASOURCE_USERNAME: undangan
      SPRING_DATASOURCE_PASSWORD: undangan
      JWT_SECRET: "test-secret-key-minimum-256-bit-length-1234567890"
      JWT_EXPIRATION_SECONDS: "86400"
      STORAGE_THEMES_PATH: /app/storage/themes
      STORAGE_MUSICS_PATH: /app/storage/musics
      STORAGE_IMAGES_PATH: /app/storage/images
      MAX_MUSIC_SIZE_MB: "10"
      MAX_IMAGE_SIZE_MB: "5"
    volumes:
      - ../TemaUndangan:/app/storage/themes
      - ../Musics:/app/storage/musics
      - ../Images:/app/storage/images
    networks:
      - database_net

networks:
  database_net:
    external: true
    name: database_undangan-net
