spring.application.name=online

# Datasource — values di-inject dari environment variable oleh Docker Compose
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/undangan}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:undangan}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:undangan}

# JPA — validate/none, BUKAN update/create (aturan CLAUDE.md)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Jakarta
spring.jackson.time-zone=Asia/Jakarta

# Actuator — expose hanya health (default lain tetap hidden)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# === Fase 2: Security & Storage ===

# JWT
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_SECONDS:86400}000
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_SECONDS:604800}000

# CORS
app.cors.allowed-origin-url=${FRONTEND_ORIGIN_URL:http://localhost:5173}

# Environment
app.env=${APP_ENV:dev}

# Storage paths (mount dari docker-compose)
app.storage.themes=${STORAGE_THEMES_PATH:/app/storage/themes}
app.storage.musics=${STORAGE_MUSICS_PATH:/app/storage/musics}
app.storage.images=${STORAGE_IMAGES_PATH:/app/storage/images}

# Max file upload
spring.servlet.multipart.max-file-size=${MAX_MUSIC_SIZE_MB:10}MB
spring.servlet.multipart.max-request-size=50MB

# Spring Security — nonaktifkan default login form (API-only)
spring.security.filter.order=1
