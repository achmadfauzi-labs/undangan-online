services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: undangan
      POSTGRES_USER: undangan
      POSTGRES_PASSWORD: undangan
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U undangan -d undangan"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
